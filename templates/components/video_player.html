<!-- Active Video Banner -->
            <div id="activeVideoBanner" class="active-video-banner" style="display: none;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="active-video-dot"></span>
                    <span id="activeVideoTitle" style="font-weight: 500; font-size: 0.875rem;">Now Previewing</span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="restoreOriginalVideo()" style="width: auto; padding: 4px 10px; font-size: 0.8rem;">↩ Back to Original Video</button>

            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" controls></video>

                <button id="btnToggleCropOverlay" class="btn-crop-toggle" onclick="toggleCropOverlay()" title="Toggle Interactive Crop Box" style="display: none;">

                        <div class="crop-handle handle-ml" data-dir="ml"></div>
                        <div class="crop-handle handle-mr" data-dir="mr"></div>
                        <div class="crop-handle handle-bl" data-dir="bl"></div>
                        <div class="crop-handle handle-bc" data-dir="bc"></div>
                        <div class="crop-handle handle-br" data-dir="br"></div>

                    </div>
                </div>
