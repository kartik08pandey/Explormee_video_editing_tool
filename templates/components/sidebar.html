<!-- Sidebar / Input -->
    <div class="sidebar">
        <div class="header">
            <div class="header-top-row">
                <div>
                    <h1>Video Editor</h1>
                    <p>Powered by Python & FFmpeg</p>
                </div>
                <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Switch to dark mode (Alt+T)" role="switch" aria-checked="false">
                    <span class="theme-toggle-track">
                        <span class="theme-toggle-icon icon-sun" aria-hidden="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </span>
                        <span class="theme-toggle-icon icon-moon" aria-hidden="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </span>
                        <span class="theme-toggle-thumb" aria-hidden="true"></span>
                    </span>
                </button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv,.webm,.mpeg,.mpg" style="display: none;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="btn" id="btnImport" style="flex: 1; padding: 12px 18px; font-size: 0.95rem; font-weight: 600;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Import Video
                </button>
                <button class="btn btn-outline" id="btnNewProject" title="Clear current project and start fresh" style="display: none; padding: 12px 14px; font-size: 0.85rem; font-weight: 600; white-space: nowrap;">
                    ✨ New
                </button>
            </div>
            <div id="uploadStatus" class="status-box" style="margin-top: 12px;"></div>
            <div class="upload-progress-wrap" id="uploadProgressWrap">
                <div class="upload-progress-header">
                    <span class="upload-progress-filename" id="uploadFileName"></span>
                    <span class="upload-progress-pct" id="uploadPct">0%</span>
                </div>
                <div class="upload-progress-track">
                    <div class="upload-progress-bar" id="uploadBar"></div>
                </div>
                <div class="upload-progress-meta">
                    <span id="uploadSize"></span>
                    <span id="uploadSpeed"></span>
                    <span id="uploadETA"></span>
                    <button class="upload-cancel-btn" id="uploadCancelBtn" type="button">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Generate Clips Input & Button -->
        <div class="card tools-section" id="splitInputCard">
            <div class="card-title">Generate Clips</div>
            <label for="durations">Timestamp Ranges (Start &ndash; End)</label>
            <div style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 8px;">
                Enter non-sequential cuts like <code>00:10 - 00:25</code> or <code>01:15 to 01:45</code> (one per line).
            </div>
            <textarea id="durations" rows="4" placeholder="00:10 - 00:25&#10;01:15 - 01:45&#10;05:00 - 05:30"></textarea>
            <button class="btn" id="btnSplit" onclick="processTask('split')">Generate Clips</button>
            <div id="splitStatus" class="status-box" style="margin-top:12px;"></div>
        </div>

        <!-- Crop Tool -->
        <div class="card tools-section" id="cropCard">
            <div class="card-title">Crop Video</div>
            <div class="grid-2" style="margin-bottom: 12px;">
                <div>
                    <label>Aspect Ratio</label>
                    <select id="cropRatio" onchange="applyAspectRatio()">
                        <option value="free">Free</option>
                        <option value="1">1:1 (Square)</option>
                        <option value="1.777777">16:9 (Landscape)</option>
                        <option value="0.5625">9:16 (Portrait)</option>
                        <option value="1.333333">4:3</option>
                        <option value="0.75">3:4</option>
                    </select>
                </div>
                <div style="display: flex; align-items: flex-end; padding-bottom: 16px;">
                    <button class="btn btn-outline" onclick="resetCrop()" style="padding: 9px 12px;">Reset Full</button>
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>X Offset (px)</label>
                    <input type="number" id="cropX" value="0" min="0" onchange="syncCropFromInputs()">
                </div>
                <div>
                    <label>Y Offset (px)</label>
                    <input type="number" id="cropY" value="0" min="0" onchange="syncCropFromInputs()">
                </div>
                <div>
                    <label>Width (px)</label>
                    <input type="number" id="cropW" value="1280" min="1" onchange="syncCropFromInputs()">
                </div>
                <div>
                    <label>Height (px)</label>
                    <input type="number" id="cropH" value="720" min="1" onchange="syncCropFromInputs()">
                </div>
            </div>
            <button class="btn" id="btnCrop" onclick="processTask('crop')">Crop Video</button>
            <div id="cropStatus" class="status-box" style="margin-top:12px;"></div>
            <div id="cropOutputs"></div>
        </div>

        <!-- Video Speed Tool -->
        <div class="card tools-section" id="speedCard">
            <div class="card-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: #f59e0b; font-size: 1.1rem;">⚡</span> Video Speed
                </span>
                <span id="speedTargetTypeBadge" class="badge-pill" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.35); font-size: 0.72rem; padding: 2px 7px;">
                    Main Video
                </span>
            </div>

            <!-- Target Selection Tabs -->
            <div style="display: flex; gap: 4px; margin-bottom: 8px;">
                <button type="button" id="tabSpeedMaster" class="btn btn-sm speed-tab-btn active" onclick="openSpeedForMasterVideo()" style="flex: 1; padding: 4px 4px; font-size: 0.73rem; font-weight: 600;">
                    🎬 Main Video
                </button>
                <button type="button" id="tabSpeedClip" class="btn btn-outline btn-sm speed-tab-btn" onclick="focusCurrentOrFirstClip()" style="flex: 1; padding: 4px 4px; font-size: 0.73rem; font-weight: 600;">
                    📹 Timeline Clip
                </button>
                <button type="button" id="tabSpeedMerged" class="btn btn-outline btn-sm speed-tab-btn" onclick="openSpeedForMergedVideo()" style="display: none; flex: 1; padding: 4px 4px; font-size: 0.73rem; font-weight: 600;">
                    🎞 Merged
                </button>
            </div>

            <!-- Target Video Info Box -->
            <div style="background: var(--surface-secondary, #0f172a); border: 1px solid var(--border-color, #334155); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span style="font-size: 0.74rem; color: var(--text-secondary); font-weight: 500;">Target:</span>
                    <span id="speedTargetName" style="font-family: monospace; font-size: 0.78rem; font-weight: 600; color: var(--text-primary); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        (No video)
                    </span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.74rem; color: var(--text-secondary); font-weight: 500;">Duration:</span>
                    <span style="font-family: monospace; font-size: 0.8rem; font-weight: 700;">
                        <span id="speedOrigDurText" style="color: var(--text-secondary);">00:00.00</span>
                        <span style="color: var(--text-secondary); margin: 0 2px;">➔</span>
                        <span id="speedNewDurText" style="color: #38bdf8;">00:00.00</span>
                        <span id="speedDiffBadge" style="font-size: 0.68rem; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 1px 4px; border-radius: 3px; margin-left: 3px;">-0.0s</span>
                    </span>
                </div>
            </div>

            <!-- Speed Presets Chips -->
            <div style="margin-bottom: 10px;">
                <label style="display: block; font-size: 0.74rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px;">Presets</label>
                <div class="speed-presets-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;">
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.0)" style="padding: 4px 1px; font-size: 0.72rem;">1.0x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.1)" style="padding: 4px 1px; font-size: 0.72rem;">1.1x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.2)" style="padding: 4px 1px; font-size: 0.72rem;">1.2x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.25)" style="padding: 4px 1px; font-size: 0.72rem;">1.25x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.3)" style="padding: 4px 1px; font-size: 0.72rem;">1.3x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.4)" style="padding: 4px 1px; font-size: 0.72rem;">1.4x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(1.5)" style="padding: 4px 1px; font-size: 0.72rem;">1.5x</button>
                    <button type="button" class="btn btn-outline btn-sm speed-preset-chip" onclick="setSpeedPreset(2.0)" style="padding: 4px 1px; font-size: 0.72rem;">2.0x</button>
                </div>
            </div>

            <!-- Fine-tuning Slider -->
            <div style="margin-bottom: 10px; background: var(--surface-secondary, rgba(15, 23, 42, 0.4)); border: 1px solid var(--border-color, #334155); border-radius: 6px; padding: 7px 9px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label for="speedSliderInput" style="font-size: 0.76rem; font-weight: 600; color: var(--text-primary); margin: 0;">Multiplier:</label>
                    <span id="speedValueReadout" style="font-family: monospace; font-size: 1.05rem; font-weight: 700; color: #f59e0b;">1.20x</span>
                </div>
                <input type="range" id="speedSliderInput" min="0.5" max="2.0" step="0.05" value="1.2"
                       style="width: 100%; cursor: pointer; accent-color: #f59e0b; margin: 0;"
                       oninput="onSpeedSliderInput(this.value)">
                <div style="display: flex; justify-content: space-between; font-size: 0.67rem; color: var(--text-secondary); margin-top: 2px;">
                    <span>0.5x</span>
                    <span>1.0x</span>
                    <span>1.5x</span>
                    <span>2.0x</span>
                </div>
            </div>

            <!-- Instant Live Preview Button -->
            <div style="margin-bottom: 10px;">
                <button type="button" class="btn btn-outline btn-sm" onclick="previewCurrentSpeedInPlayer()" style="width: 100%; padding: 5px 8px; font-size: 0.77rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px;">
                    <span>▶ Preview in Player (<span id="previewSpeedBtnText">1.2x</span>)</span>
                </button>
            </div>

            <!-- Options: Output Mode & Audio Pitch -->
            <div style="margin-bottom: 10px; font-size: 0.75rem;">
                <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
                    <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-primary);">
                        <input type="radio" name="speedOutputMode" value="replace" checked style="accent-color: #f59e0b;">
                        <span id="speedModeReplaceLabel">Apply to selected (Replace in place)</span>
                    </label>
                    <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-primary);">
                        <input type="radio" name="speedOutputMode" value="new" style="accent-color: #f59e0b;">
                        <span id="speedModeNewLabel">Save as new video file</span>
                    </label>
                </div>
                <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="speedPreservePitch" checked style="accent-color: #f59e0b;">
                    <span>Maintain audio pitch (prevents chipmunk)</span>
                </label>
            </div>

            <!-- Apply & Progress / Stop Action Area -->
            <div id="speedActionsContainer">
                <button type="button" id="btnConfirmSpeed" class="btn" onclick="executeSpeedChange()" style="width: 100%; padding: 9px; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                    <span>⚡ Apply Speed</span>
                </button>
            </div>

            <!-- Processing Progress with Stop/Cancel Button -->
            <div id="speedProgressWrap" style="display: none; margin-top: 10px; background: var(--surface-secondary, #0f172a); border: 1px solid var(--border-color, #334155); border-radius: 6px; padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span id="speedProgressMsg" style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">Processing...</span>
                    <span id="speedProgressPct" style="font-family: monospace; font-size: 0.8rem; font-weight: 700; color: #f59e0b;">0%</span>
                </div>
                <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 8px;">
                    <div id="speedProgressBar" style="width: 0%; height: 100%; background: #f59e0b; transition: width 0.15s ease;"></div>
                </div>
                <button type="button" id="btnCancelSpeed" class="btn btn-outline btn-sm" onclick="cancelSpeedTask()" style="width: 100%; padding: 5px; font-size: 0.76rem; font-weight: 600; color: #ef4444; border-color: rgba(239, 68, 68, 0.4); display: inline-flex; align-items: center; justify-content: center; gap: 4px;">
                    <span>⛔ Stop / Cancel Processing</span>
                </button>
            </div>

            <div id="speedStatus" class="status-box" style="margin-top: 10px; display: none;"></div>
        </div>

        <!-- File Details -->
        <div class="card tools-section" id="metaCard">
            <div class="card-title">File Details</div>
            <table class="meta-table" id="metaTable">
                <tbody>
                    <!-- Injected via JS -->
                </tbody>
            </table>
        </div>
    </div>
